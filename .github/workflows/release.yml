name: Release to LuaRocks

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Lua / LuaJIT and Luarocks
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Setup Luarocks
        uses: leafo/gh-actions-luarocks@v5

      - name: Build Rock Package
        run: |
          ROCKSPEC=$(ls -1 kong-oidc-plugin-*.rockspec *.rockspec 2>/dev/null | head -n 1)
          echo "Building rock package for $ROCKSPEC..."
          luarocks pack "$ROCKSPEC"
          ls -la *.rock

      - name: Upload to LuaRocks
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API }}
        run: |
          ROCKSPEC=$(ls -1 kong-oidc-plugin-*.rockspec *.rockspec 2>/dev/null | head -n 1)
          echo "Uploading $ROCKSPEC to LuaRocks..."
          luarocks upload "$ROCKSPEC" --api-key="$LUAROCKS_API_KEY" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.rock
            *.rockspec
          generate_release_notes: true
